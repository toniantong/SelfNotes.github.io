<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML ➔ Markdown 轉換工具 (純離線全選增強版)</title>
  <style>
    /* 純離線內建響應式樣式 - 零外部 CSS 依賴 */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #333333;
      --primary-color: #0d6efd;
      --danger-color: #dc3545;
      --secondary-color: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }

    .col {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .label {
      font-weight: bold;
    }

    .btn-group button {
      margin-left: 4px;
    }

    textarea {
      width: 100%;
      height: 320px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
    }

    textarea:focus {
      outline: 2px solid var(--primary-color);
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-secondary { background-color: var(--secondary-color); color: white; }
    .btn-danger { background-color: var(--danger-color); color: white; }

    .btn:hover { opacity: 0.9; }

    .center-btn {
      text-align: center;
      margin-bottom: 25px;
    }

    .preview-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      height: 300px;
      overflow-y: auto;
      margin-top: 8px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }

    /* 說明提示區 */
    .offline-note {
      background-color: #2b2a16;
      border: 1px solid #856404;
      color: #fff3cd;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>HTML ➔ Markdown 轉換工具 (純離線全選增強版)</h1>

    <div class="offline-note">
      <strong>純離線說明：</strong>本工具內建原生態 HTML 解析與 DOM 遞迴轉碼邏輯，零外部網路與 CDN 依賴，可在無網際網路連線下 100% 離線運作。
    </div>

    <div class="row">
      <!-- Left Column: HTML Input -->
      <div class="col">
        <div class="header-bar">
          <label for="html-input" class="label">HTML 輸入</label>
          <div class="btn-group">
            <button class="btn btn-secondary" onclick="pasteHtml()">貼上</button>
            <button class="btn btn-secondary" onclick="selectAllText('html-input')">全選</button>
            <button class="btn btn-danger" onclick="clearAll('html')">清空</button>
          </div>
        </div>
        <textarea id="html-input" placeholder="在此貼上或輸入 HTML 代碼... (例如: <h1>標題</h1><p>內文 <strong>粗體</strong></p>)"></textarea>
      </div>

      <!-- Right Column: Markdown Output -->
      <div class="col">
        <div class="header-bar">
          <label for="markdown-output" class="label">Markdown 輸出結果</label>
          <div class="btn-group">
            <button class="btn btn-secondary" onclick="copyMarkdown()">複製 Markdown</button>
            <button class="btn btn-secondary" onclick="selectAllText('markdown-output')">全選</button>
            <button class="btn btn-danger" onclick="clearAll('markdown')">清空</button>
          </div>
        </div>
        <textarea id="markdown-output" placeholder="轉換後的 Markdown 結果將在此顯示..." readonly></textarea>
      </div>
    </div>

    <!-- Center Action -->
    <div class="center-btn">
      <button class="btn btn-primary" onclick="convertHtmlToMarkdown()" style="padding: 10px 24px; font-size: 15px;">手動轉換</button>
    </div>

    <!-- Raw Markdown Output Text Area -->
    <div>
      <div class="header-bar">
        <span class="label">Markdown 純文字可視區 (Raw Markdown)</span>
        <button class="btn btn-secondary" onclick="updatePreview()">重新整理區塊</button>
      </div>
      <div id="preview-box" class="preview-box" role="region" aria-label="Markdown 純文字可視區"></div>
    </div>

    <!-- Bottom Actions -->
    <div style="margin-top: 15px;">
      <button class="btn btn-secondary" onclick="selectAllText('preview-box')">全選區塊</button>
      <button class="btn btn-secondary" onclick="copyPreviewText()">複製區塊純文字</button>
    </div>
  </div>

  <script>
    /* 內建 DOM 遞迴 HTML 轉 Markdown 解析器 (零外部依賴) */
    function htmlToMarkdown(htmlString) {
      if (!htmlString || !htmlString.trim()) return '';

      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');

        function walk(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            return node.nodeValue.replace(/\s+/g, ' ');
          }

          if (node.nodeType !== Node.ELEMENT_NODE) {
            return '';
          }

          const tagName = node.tagName.toLowerCase();
          let childrenText = Array.from(node.childNodes).map(walk).join('');

          switch (tagName) {
            case 'h1': return `\n\n# ${childrenText.trim()}\n\n`;
            case 'h2': return `\n\n## ${childrenText.trim()}\n\n`;
            case 'h3': return `\n\n### ${childrenText.trim()}\n\n`;
            case 'h4': return `\n\n#### ${childrenText.trim()}\n\n`;
            case 'h5': return `\n\n##### ${childrenText.trim()}\n\n`;
            case 'h6': return `\n\n###### ${childrenText.trim()}\n\n`;
            case 'p': return `\n\n${childrenText.trim()}\n\n`;
            case 'strong':
            case 'b':
              return `**${childrenText.trim()}**`;
            case 'em':
            case 'i':
              return `*${childrenText.trim()}*`;
            case 'del':
            case 's':
            case 'strike':
              return `~~${childrenText.trim()}~~`;
            case 'code':
              if (node.parentNode && node.parentNode.tagName.toLowerCase() === 'pre') {
                return childrenText;
              }
              return `\`${childrenText.trim()}\``;
            case 'pre':
              const codeText = node.textContent || childrenText;
              return `\n\n\`\`\`\n${codeText.trim()}\n\`\`\`\n\n`;
            case 'blockquote':
              const lines = childrenText.trim().split('\n');
              const quoted = lines.map(line => `> ${line}`).join('\n');
              return `\n\n${quoted}\n\n`;
            case 'a':
              const href = node.getAttribute('href') || '';
              return `[${childrenText.trim()}](${href})`;
            case 'img':
              const src = node.getAttribute('src') || '';
              const alt = node.getAttribute('alt') || 'image';
              return `![${alt}](${src})`;
            case 'ul':
            case 'ol':
              return `\n\n${childrenText.trim()}\n\n`;
            case 'li':
              const parent = node.parentNode ? node.parentNode.tagName.toLowerCase() : '';
              if (parent === 'ol') {
                const index = Array.from(node.parentNode.children).indexOf(node) + 1;
                return `${index}. ${childrenText.trim()}\n`;
              }
              return `- ${childrenText.trim()}\n`;
            case 'hr':
              return `\n\n---\n\n`;
            case 'br':
              return `\n`;
            case 'table':
              return `\n\n${childrenText.trim()}\n\n`;
            case 'tr':
              return `${childrenText.trim()}\n`;
            case 'th':
            case 'td':
              return `| ${childrenText.trim()} `;
            default:
              return childrenText;
          }
        }

        let result = walk(doc.body);
        result = result.replace(/\n{3,}/g, '\n\n').trim();
        return result;
      } catch (err) {
        console.error('HTML 轉 Markdown 發生錯誤:', err);
        return '轉換發生錯誤，請檢查 HTML 格式。';
      }
    }

    const htmlInput = document.getElementById('html-input');
    const markdownOutput = document.getElementById('markdown-output');
    const previewBox = document.getElementById('preview-box');

    let debounceTimer = null;

    function convertHtmlToMarkdown() {
      const htmlText = htmlInput.value;
      const md = htmlToMarkdown(htmlText);
      markdownOutput.value = md;
      updatePreview();
    }

    function updatePreview() {
      previewBox.innerText = markdownOutput.value;
    }

    // 全選文字功能 (相容 Textarea 與 一般 DOM 容器)
    function selectAllText(elementId) {
      const element = document.getElementById(elementId);
      if (element) {
        if (element.tagName.toLowerCase() === 'textarea' || element.tagName.toLowerCase() === 'input') {
          element.focus();
          element.select();
        } else {
          const range = document.createRange();
          range.selectNodeContents(element);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        }
      }
    }

    function clearAll(type) {
      if (type === 'html' || type === 'markdown') {
        if (type === 'html') htmlInput.value = '';
        markdownOutput.value = '';
        previewBox.innerText = '';
      }
    }

    async function pasteHtml() {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        alert('當前瀏覽器環境限制剪貼簿存取，請使用快捷鍵 Ctrl+V / Cmd+V 貼上。');
        return;
      }
      try {
        const text = await navigator.clipboard.readText();
        htmlInput.value = text;
        convertHtmlToMarkdown();
      } catch (e) {
        alert('無法存取剪貼簿，請手動貼上。');
      }
    }

    async function copyMarkdown() {
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        alert('請手動選取 Markdown 輸出框內容進行複製。');
        return;
      }
      try {
        await navigator.clipboard.writeText(markdownOutput.value);
        alert('Markdown 結果已成功複製！');
      } catch (e) {
        alert('複製失敗，請手動複製。');
      }
    }

    async function copyPreviewText() {
      const text = previewBox.innerText;
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        alert('請手動選取區塊文字進行複製。');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        alert('區塊文字已複製！');
      } catch (e) {
        alert('複製失敗，請手動複製。');
      }
    }

    // 防抖即時轉換 (Debounced Input Event)
    htmlInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(convertHtmlToMarkdown, 250);
    });
  </script>
</body>

</html>
