<!DOCTYPE html>

<body>  
 <div class="container">  
 <h1>密碼產生器小工具</h1>  
 <p class="subtitle">BitPRNG 高熵等可能隨機取樣 · 支援字元集包含、自定義輸入、排除類似字元與批量生成</p>  
  
 <!-- 種子控制 -->  
 <div class="card">

 <script>  
 // BitPRNG 64-bit 實作  
 const MASK64 = 0xFFFFFFFFFFFFFFFFn;  
  
 function mask64(x) {  
 return BigInt.asUintN(64, x);  
 }  
  
 function genSBox8() {  
 const s = new Array(256);  
 for (let i = 0; i < 256; i++) {  
 let v = (i * 0x9E3779B9 + 0x3C6EF372) & 0xFF;  
 v = (v ^ ((v << 1) & 0xFF) ^ ((v << 2) & 0xFF) ^ ((v << 3) & 0xFF) ^ 0x63) & 0xFF;  
 s[i] = v;  
 }  
 return s;  
 }  
  
 const SBOX8 = genSBox8();  
  
 class BitPRNG {  
 constructor(seed = null, warmup = 32) {  
 this.reseed(seed !== null ? mask64(seed) : 0x123456789ABCDEF0n, warmup);  
 }  
  
 static applySBox64(x) {  
 x = mask64(x);  
 let out = 0n;  
 for (let i = 0; i < 8; i++) {  
 const b = Number((x >> BigInt(i * 8)) & 0xFFn);  
 out |= BigInt(SBOX8[b]) << BigInt(i * 8);  
 }  
 return mask64(out);  
 }  
  
 static splitmix64(x) {  
 x = mask64(x + 0x9E3779B97F4A7C15n);  
 let z = x;  
 z = mask64((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n);  
 z = mask64((z ^ (z >> 27n)) * 0x94D049BB133111EBn);  
 return mask64(z ^ (z >> 31n));  
 }  
  
 static rotl64(x, k) {  
 k &= 63;  
 if (k === 0) return mask64(x);  
 const kb = BigInt(k);  
 return mask64((x << kb) | (x >> (64n - kb)));  
 }  
  
 static arx4(a, b, c, d, rounds = 4) {  
 for (let i = 0; i < rounds; i++) {  
 a = mask64(a + b);  
 d = BitPRNG.rotl64(d ^ a, 32);  
 c = mask64(c + d);  
 b = BitPRNG.rotl64(b ^ c, 24);  
 a = mask64(a + b);  
 d = BitPRNG.rotl64(d ^ a, 16);  
 c = mask64(c + d);  
 b = BitPRNG.rotl64(b ^ c, 12);  
 }  
 return [a, b, c, d];  
 }  
  
 reseed(newSeed, warmup = 32) {  
 let st = mask64(newSeed);  
 this.state = [];  
 for (let i = 0; i < 6; i++) {  
 st = BitPRNG.splitmix64(st);  
 this.state.push(st);  
 }  
 this.clocks = [];  
 for (let i = 0; i < 8; i++) {  
 st = BitPRNG.splitmix64(st);  
 this.clocks.push(st);  
 }  
 this.w1Seed = BitPRNG.splitmix64(st);  
 this.w2Seed = BitPRNG.splitmix64(this.w1Seed);  
  
 this.w1Matrix = [];  
 for (let j = 0; j < 8; j++) {  
 const row = [];  
 for (let i = 0; i < 12; i++) {  
 const term = mask64(this.w1Seed + BigInt(i) * 0x9E37n + BigInt(j));  
 row.push((BitPRNG.splitmix64(term) ^ BigInt(i * 0xA5A5A5A5)) & 0xFFFFFFFFn);  
 }  
 this.w1Matrix.push(row);  
 }  
  
 this.w2Matrix = [];  
 for (let j = 0; j < 6; j++) {  
 const row = [];  
 for (let i = 0; i < 8; i++) {  
 const term = mask64(this.w2Seed + BigInt(i) * 0xC3C3C3C3n + BigInt(j));  
 row.push((BitPRNG.splitmix64(term) ^ BigInt(j * 0x5A5A5A5A)) & 0xFFFFFFFFn);  
 }  
 this.w2Matrix.push(row);  
 }  
  
 for (let i = 0; i < warmup; i++) this.stepInternal();  
 }  
  
 stepInternal() {  
 const s = this.state, c = this.clocks;  
 c[1] = mask64(c[1] + (s[0] ^ BitPRNG.rotl64(s[1], 13)) + 0x9E37n);  
 c[3] = mask64(c[3] + (s[1] ^ BitPRNG.rotl64(s[2], 19)) + 0x7F4An);  
 c[5] = mask64(c[5] + (s[2] ^ BitPRNG.rotl64(s[3], 23)) + 0x3C6En);  
 c[7] = mask64(c[7] + (s[3] ^ BitPRNG.rotl64(s[4], 29)) + 0x5B2Dn);  
  
 c[0] = mask64(c[0] + c[1]);  
 c[2] = mask64(c[2] + c[3]);  
 c[4] = mask64(c[4] + c[5]);  
 c[6] = mask64(c[6] + c[7]);  
  
 const rot1 = 11 + Number(c[0] & 31n), rot2 = 17 + Number(c[2] & 27n);  
 const rot3 = 23 + Number(c[4] & 23n), rot4 = 29 + Number(c[6] & 19n);  
  
 const [x, y, z, w, v, u] = s;  
 const x_n = mask64(x * 0x5851F42D4C957F2Dn + y + BitPRNG.rotl64(z, rot1) + mask64((x * y) >> 32n) + c[0]);  
 const y_n = mask64(y * 0x14057B7EF767814Fn + z + BitPRNG.rotl64(w, rot2) + mask64((y * z) >> 32n) + c[2]);  
 const z_n = mask64(z * 0x2545F4914F6CDD1Dn + w + BitPRNG.rotl64(v, rot3) + mask64((z * w) >> 32n) + c[4]);  
 const w_n = mask64(w * 0x5851F42D4C957F2Dn + v + BitPRNG.rotl64(u, rot4) + mask64((w * u) >> 32n) + c[6]);  
 const v_n = mask64((v * 0x14057B7EF767814Fn + u) ^ BitPRNG.rotl64(x, 53));  
 const u_n = mask64((u * 0x2545F4914F6CDD1Dn + x) ^ BitPRNG.rotl64(y, 29));  
  
 const current = [x_n, y_n, z_n, w_n, v_n, u_n];  
 const channels = [];  
 for (const val of current) {  
 channels.push(val & 0xFFFFFFFFn);  
 channels.push((val >> 32n) & 0xFFFFFFFFn);  
 }  
  
 const hidden = [];  
 for (let j = 0; j < 8; j++) {  
 let sumVal = 0n;  
 for (let i = 0; i < 12; i++) sumVal = mask64(sumVal + channels[i] * this.w1Matrix[j][i]);  
 hidden.push(BitPRNG.applySBox64(sumVal));  
 }  
  
 const neuralOut = [];  
 for (let j = 0; j < 6; j++) {  
 let sumVal = 0n;  
 for (let i = 0; i < 8; i++) sumVal = mask64(sumVal + (hidden[i] & 0xFFFFFFFFn) * this.w2Matrix[j][i]);  
 neuralOut.push(BitPRNG.applySBox64(sumVal));  
 }  
  
 const residual = [];  
 for (let i = 0; i < 6; i++) {  
 const err = current[i] ^ neuralOut[i];  
 residual.push(mask64(current[i] + BitPRNG.rotl64(BitPRNG.applySBox64(err), 19 + i * 7)));  
 }  
  
 const [a, b, c2, d] = BitPRNG.arx4(residual[0], residual[1], residual[2], residual[3], 4);  
 const [e, f] = BitPRNG.arx4(residual[4], residual[5], a, c2, 4);  
  
 const erasedA = BitPRNG.applySBox64(a ^ BitPRNG.splitmix64(e));  
 const erasedB = BitPRNG.applySBox64(b ^ BitPRNG.splitmix64(f));  
  
 this.state = [erasedA, erasedB, c2, d, e, f];  
  
 const combined = erasedA ^ erasedB ^ c2 ^ d ^ e ^ f;  
 const [o1, o2, o3, o4] = BitPRNG.arx4(combined, erasedA, erasedB, this.w1Seed, 4);  
  
 return BitPRNG.applySBox64(o1 ^ o2 ^ o3 ^ o4);  
 }  
  
 nextU64() {  
 return this.stepInternal();  
 }  
  
 nextIntRange(min, max) {  
 if (min > max) [min, max] = [max, min];  
 const range = BigInt(max - min + 1);  
 if (range === 1n) return min;  
  
 const maxVal = 0xFFFFFFFFFFFFFFFFn;  
 const limit = maxVal - (maxVal % range);  
 let r;  
 do {  
 r = this.nextU64();  
 } while (r >= limit);  
  
 return min + Number(r % range);  
 }  
 }  
  
 const UPPER_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";  
 const LOWER_CHARS = "abcdefghijklmnopqrstuvwxyz";  
 const NUMBER_CHARS = "0123456789";  
 const SYMBOL_CHARS = "!@#$%^&*()_+-=[]{}|;:,.<?>";  
 const AMBIGUOUS_REGEX = /[1lI0Oo2Z5S8B]/g;  
  
 let prng = null;  
 let generatedPasswords = [];  
  
 function parseSeed(str) {  
 str = str.trim();  
 if (!str) throw new Error("種子不可為空");  
 if (/^0[xX][0-9a-fA-F]+$/.test(str)) return BigInt(str);  
 if (/^-?\d+$/.test(str)) return BigInt(str);  
 throw new Error("種子格式錯誤");  
 }  
  
 function toHex(v) {  
 return "0x" + v.toString(16).toUpperCase().padStart(16, "0");  
 }  
  
 function setStatus(id, msg, type = "") {  
 const el = document.getElementById(id);  
 el.textContent = msg;  
 el.className = "status" + (type ? " " + type : "");  
 }  
  
 function initPRNG() {  
 try {  
 const seed = parseSeed(document.getElementById("seedInput").value);  
 const warmup = parseInt(document.getElementById("warmupInput").value, 10) || 0;  
 prng = new BitPRNG(seed, warmup);  
 setStatus("seedStatus", `已初始化 PRNG · Seed = ${toHex(seed)} · Warmup = ${warmup}`, "ok");  
 } catch (e) {  
 setStatus("seedStatus", e.message, "err");  
 }  
 }  
  
 document.getElementById("btnReseed").addEventListener("click", initPRNG);  
  
 document.getElementById("btnRandomSeed").addEventListener("click", () => {  
 const arr = new Uint32Array(2);  
 crypto.getRandomValues(arr);  
 const s = (BigInt(arr[0]) << 32n) | BigInt(arr[1]);  
 document.getElementById("seedInput").value = toHex(s);  
 initPRNG();  
 });  
  
 document.getElementById("btnGenerate").addEventListener("click", () => {  
 if (!prng) initPRNG();  
 if (!prng) return;  
  
 const incUpper = document.getElementById("chkUpper").checked;  
 const incLower = document.getElementById("chkLower").checked;  
 const incNumbers = document.getElementById("chkNumbers").checked;  
 const incSymbols = document.getElementById("chkSymbols").checked;  
 const incCustom = document.getElementById("chkCustom").checked;  
 const excludeAmbiguous = document.getElementById("chkExcludeAmbiguous").checked;  
  
 const customCharsInput = document.getElementById("customCharsInput").value;  
 const length = parseInt(document.getElementById("lengthInput").value, 10);  
 const count = parseInt(document.getElementById("countInput").value, 10);  
  
 if (!incUpper && !incLower && !incNumbers && !incSymbols && !incCustom) {  
 setStatus("genStatus", "請至少勾選一種字元集 (大寫/小寫/數字/符號/自定義)", "err");  
 return;  
 }  
  
 if (incCustom && (!customCharsInput || customCharsInput.length === 0)) {  
 setStatus("genStatus", "已勾選自定義字元，請輸入欲包含的自定義字元內容", "err");  
 return;  
 }  
  
 if (isNaN(length) || length < 4) {  
 setStatus("genStatus", "密碼長度至少需為 4 位", "err");  
 return;  
 }  
  
 if (isNaN(count) || count < 1) {  
 setStatus("genStatus", "產生數量必須至少為 1", "err");  
 return;  
 }  
  
 let upperPool = incUpper ? UPPER_CHARS : "";  
 let lowerPool = incLower ? LOWER_CHARS : "";  
 let numPool = incNumbers ? NUMBER_CHARS : "";  
 let symPool = incSymbols ? SYMBOL_CHARS : "";  
 let customPool = incCustom ? customCharsInput : "";  
  
 if (excludeAmbiguous) {  
 upperPool = upperPool.replace(AMBIGUOUS_REGEX, "");  
 lowerPool = lowerPool.replace(AMBIGUOUS_REGEX, "");  
 numPool = numPool.replace(AMBIGUOUS_REGEX, "");  
 symPool = symPool.replace(AMBIGUOUS_REGEX, "");  
 customPool = customPool.replace(AMBIGUOUS_REGEX, "");  
 }  
  
 if (incCustom) {  
 customPool = Array.from(new Set(Array.from(customPool))).join("");  
 }  
  
 const activePools = [upperPool, lowerPool, numPool, symPool, customPool].filter(p => p.length > 0);  
  
 if (activePools.length === 0) {  
 setStatus("genStatus", "排除類似字元或去重後無可用字元，請調整勾選與自定義輸入條件", "err");  
 return;  
 }  
  
 if (length < activePools.length) {  
 setStatus("genStatus", `密碼長度 (${length}) 不可小於所選取的字元集種類數量 (${activePools.length})`, "err");  
 return;  
 }  
  
 const fullPool = activePools.join("");  
 const fullPoolChars = Array.from(fullPool);  
  
 const results = [];  
 for (let c = 0; c < count; c++) {  
 let passwordArr = [];  
  
 // 保證每個被勾選的池至少抽到 1 個字元  
 activePools.forEach(p => {  
 const pChars = Array.from(p);  
 if (pChars.length > 0) {  
 const idx = prng.nextIntRange(0, pChars.length - 1);  
 passwordArr.push(pChars[idx]);  
 }  
 });  
  
 // 剩餘長度自全池隨機填滿  
 while (passwordArr.length < length) {  
 const idx = prng.nextIntRange(0, fullPoolChars.length - 1);  
 passwordArr.push(fullPoolChars[idx]);  
 }  
  
 // Fisher-Yates 洗牌打亂順序，避免固定開頭  
 for (let i = passwordArr.length - 1; i > 0; i--) {  
 const j = prng.nextIntRange(0, i);  
 [passwordArr[i], passwordArr[j]] = [passwordArr[j], passwordArr[i]];  
 }  
  
 results.push(passwordArr.join(""));  
 }  
  
 generatedPasswords = results;  
  
 // 渲染結果列表  
 const container = document.getElementById("passwordsContainer");  
 container.innerHTML = "";  
 results.forEach((pw) => {  
 const item = document.createElement("div");  
 item.className = "password-item";  
 item.innerHTML = `  
 <span class="password-text">${pw}</span>  
 <button class="btn btn-sm btn-secondary" onclick="copySinglePassword('${pw}')">複製</button>  
 `;  
 container.appendChild(item);  
 });  
  
 // 評估熵值與強度 (Entropy = L * log2(PoolSize))  
 const entropy = Math.floor(length * Math.log2(fullPoolChars.length));  
 const strengthBar = document.getElementById("strengthBar");  
 const strengthLabel = document.getElementById("strengthLabel");  
  
 let pct = Math.min(100, Math.max(10, Math.floor((entropy / 128) * 100)));  
 strengthBar.style.width = pct + "%";  
  
 if (entropy < 40) {  
 strengthBar.style.background = "var(--danger)";  
 strengthLabel.textContent = `密碼預估安全強度：薄弱 (${entropy} bits 熵)`;  
 } else if (entropy < 70) {  
 strengthBar.style.background = "#f59e0b";  
 strengthLabel.textContent = `密碼預估安全強度：中等 (${entropy} bits 熵)`;  
 } else {  
 strengthBar.style.background = "var(--success)";  
 strengthLabel.textContent = `密碼預估安全強度：高強度 (${entropy} bits 熵)`;  
 }  
  
 setStatus("genStatus", `已成功生成 ${count} 組密碼 (長度 ${length}，字元池大體 ${fullPoolChars.length} 個字元)`, "ok");  
 });  
  
 window.copySinglePassword = async function(pw) {  
 try {  
 await navigator.clipboard.writeText(pw);  
 setStatus("genStatus", "已成功複製密碼", "ok");  
 } catch {  
 setStatus("genStatus", "複製失敗", "err");  
 }  
 };  
  
 document.getElementById("btnClear").addEventListener("click", () => {  
 generatedPasswords = [];  
 document.getElementById("passwordsContainer").innerHTML = `<span style="color: var(--muted); font-size: 0.85rem;">點擊「生成密碼」開始產生…</span>`;  
 document.getElementById("strengthBar").style.width = "0%";  
 document.getElementById("strengthLabel").textContent = "密碼預估安全強度：-";  
 setStatus("genStatus", "");  
 });  
  
 document.getElementById("btnCopyAll").addEventListener("click", async () => {  
 if (generatedPasswords.length === 0) {  
 setStatus("genStatus", "無可複製密碼", "err");  
 return;  
 }  
 try {  
 await navigator.clipboard.writeText(generatedPasswords.join("\n"));  
 setStatus("genStatus", "已批量複製所有密碼", "ok");  
 } catch {  
 setStatus("genStatus", "複製失敗", "err");  
 }  
 });  
  
 document.getElementById("btnCopyJSON").addEventListener("click", async () => {  
 if (generatedPasswords.length === 0) {  
 setStatus("genStatus", "無可複製密碼", "err");  
 return;  
 }  
 try {  
 await navigator.clipboard.writeText(JSON.stringify(generatedPasswords, null, 2));  
 setStatus("genStatus", "已複製 JSON 格式密碼", "ok");  
 } catch {  
 setStatus("genStatus", "複製失敗", "err");  
 }  
 });  
  
 initPRNG();  
 </script>  
</body>  
</html>
