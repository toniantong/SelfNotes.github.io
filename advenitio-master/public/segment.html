<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開源中文分詞工具</title>
    <!-- 修正 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 修正 Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- 標頭 -->
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">開源中文分詞工具</h1>
            <p class="text-gray-600 text-sm">純前端靜態響應式網頁，保障隱私，本地運算不傳輸文字。</p>
        </header>

        <!-- 主要佈局 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 左側/上方：輸入與自訂詞庫 -->
            <div class="md:col-span-2 space-y-6">
                <!-- 文字輸入區 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">請輸入中文文字</label>
                    <textarea 
                        v-model="inputText" 
                        class="w-full h-48 p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none text-base"
                        placeholder="請在此輸入要進行分詞的中文句子或段落..."></textarea>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="text-xs text-gray-400">字數：{{ inputText.length }} 字</span>
                        <button 
                            @click="inputText = ''" 
                            class="text-xs text-red-500 hover:text-red-700 font-medium">
                            清空文字
                        </button>
                    </div>
                </div>

                <!-- 分詞結果展示 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center justify-between">
                        <span>分詞結果</span>
                        <span class="text-xs px-2 py-1 bg-blue-50 text-blue-600 rounded">
                            共 {{ segments.length }} 個詞條
                        </span>
                    </h2>
                    
                    <!-- 標籤型態展示 -->
                    <div v-if="segments.length > 0" class="flex flex-wrap gap-2 p-4 bg-gray-50 rounded-lg min-h-[100px]">
                        <span 
                            v-for="(word, index) in segments" 
                            :key="index"
                            class="px-3 py-1 bg-white border border-gray-200 text-gray-700 rounded-md shadow-xs hover:border-blue-400 transition-colors cursor-pointer text-sm">
                            {{ word }}
                        </span>
                    </div>
                    <div v-else class="text-center py-8 text-gray-400 text-sm border-2 border-dashed border-gray-100 rounded-lg">
                        等待輸入文字進行自動分詞...
                    </div>
                </div>
            </div>

            <!-- 右側/下方：自訂詞庫管理 -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-full">
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">自訂字典優先擴充</h2>
                    <p class="text-xs text-gray-400 mb-4">每行輸入一個自訂詞彙（如專有名詞、新詞），分詞器將優先匹配。</p>
                    
                    <textarea 
                        v-model="customDictInput" 
                        @input="updateDict"
                        class="w-full h-40 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm font-mono"
                        placeholder="例如：&#10;開源中文詞語庫&#10;響應式網頁&#10;自然語言處理"></textarea>
                    
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <div class="flex justify-between text-xs text-gray-500 mb-2">
                            <span>系統核心詞數:</span>
                            <span class="font-semibold text-gray-700">{{ defaultDict.size }}</span>
                        </div>
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>自訂擴充詞數:</span>
                            <span class="font-semibold text-green-600">{{ customDict.size }}</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 頁尾 -->
        <footer class="mt-12 text-center text-xs text-gray-400 border-t border-gray-200 pt-4">
            採用基於正向最大匹配（FMM）前端演算法 • 響應式 UI 設計
        </footer>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                // 內建核心中文常用詞庫
                const defaultWords = [
                    "開源", "中文", "詞語庫", "詞庫", "分詞", "斷詞", "工具", "前端", "靜態", "響應式", 
                    "單一網頁", "網頁", "生成", "自然語言處理", "清華大學", "中研院", "結巴分詞", 
                    "我們", "你們", "他們", "核心", "演算法", "系統", "功能", "進行", "文字", "句子"
                ];
                
                const defaultDict = ref(new Set(defaultWords));
                const customDictInput = ref("開源中文詞語庫\n響應式單一網頁");
                const customDict = ref(new Set());
                const inputText = ref("生成中文分詞的前端靜態響應式單一網頁工具");

                // 更新自訂詞庫
                const updateDict = () => {
                    const words = customDictInput.value
                        .split('\n')
                        .map(w => w.trim())
                        .filter(w => w.length > 0);
                    customDict.value = new Set(words);
                };

                // 合併詞庫並計算最大詞長
                const dictConfig = computed(() => {
                    const combined = new Set([...defaultDict.value, ...customDict.value]);
                    let maxLen = 1;
                    for (const word of combined) {
                        if (word.length > maxLen) maxLen = word.length;
                    }
                    return { words: combined, maxLen: maxLen };
                });

                // 核心分詞演算法：正向最大匹配法 (FMM)
                const segments = computed(() => {
                    const text = inputText.value;
                    if (!text) return [];

                    const result = [];
                    const { words, maxLen } = dictConfig.value;
                    let i = 0;
                    const len = text.length;

                    while (i < len) {
                        let matched = false;
                        // 計算當前位置最多可切取的字數長度
                        let currMax = Math.min(maxLen, len - i);
                        
                        // 修正：長度由 currMax 遞減至 1 進行貪婪匹配
                        for (let size = currMax; size > 0; size--) {
                            const chunk = text.slice(i, i + size);
                            if (words.has(chunk)) {
                                result.push(chunk);
                                i += size;
                                matched = true;
                                break;
                            }
                        }

                        // 若未在詞庫命中，則按單字輸出（包含標點與空格）
                        if (!matched) {
                            result.push(text[i]);
                            i++;
                        }
                    }
                    return result;
                });

                // 初始化自訂詞庫
                updateDict();

                return {
                    inputText,
                    customDictInput,
                    defaultDict,
                    customDict,
                    segments,
                    updateDict
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
