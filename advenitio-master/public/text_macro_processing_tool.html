    <!-- JavaScript 邏輯系統 -->
    <script>
        const els = {
            input: document.getElementById('inputArea'),
            output: document.getElementById('outputArea'),
            visualizer: document.getElementById('visualizerArea'),
            search: document.getElementById('searchInput'),
            replace: document.getElementById('replaceInput'),
            chkCase: document.getElementById('chkMatchCase'),
            chkRegEx: document.getElementById('chkRegEx'),
            chkVis: document.getElementById('chkVisualize'),
            macroInput: document.getElementById('macroInput'),
            chkMacroCase: document.getElementById('chkMacroCase'),
            chkMacroRegEx: document.getElementById('chkMacroRegEx'),
            logContainer: document.getElementById('logContainer'),
            status: document.getElementById('statusMessage'),
            charCount: document.getElementById('charCount'),
            matchCount: document.getElementById('matchCount'),
            macroStepCount: document.getElementById('macroStepCount'),
            workspace: document.getElementById('workspace')
        };

        let searchMatches = [];
        let currentMatchIdx = -1;

        // 巨集執行狀態
        let macroState = {
            currentText: "",
            rules: [],
            isHalted: false,
            stepCount: 0,
            batchRuleIndex: 0,
            MAX_STEPS: 1000
        };

        // --- HTML 轉義公用函式 ---
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatForLog(str) {
            if (!str) return '<em>(空字串)</em>';
            return escapeHtml(str)
                .replace(/
/g, '<span class="text-red-400 font-bold">\n</span>')
                .replace(/	/g, '<span class="text-yellow-400 font-bold">\t</span>');
        }

        function appendLog(html) {
            if (els.logContainer.children.length === 1 && els.logContainer.children[0].classList.contains('italic')) {
                els.logContainer.innerHTML = '';
            }
            const entry = document.createElement('div');
            entry.className = 'border-b border-gray-200 dark:border-gray-800 pb-1.5 mb-1.5 last:border-none last:mb-0';
            entry.innerHTML = html;
            els.logContainer.appendChild(entry);
            els.logContainer.scrollTop = els.logContainer.scrollHeight;
        }

        // --- 核心：更新搜尋狀態 (單一搜尋) ---
        function updateSearchStatus() {
            const text = els.input.value;
            const query = els.search.value;
            els.charCount.textContent = `長度: ${text.length}`;
            searchMatches = [];
            currentMatchIdx = -1;

            if (!query) {
                els.matchCount.textContent = `匹配項: 0`;
                els.status.textContent = '就緒';
                return;
            }

            try {
                if (els.chkRegEx.checked) {
                    const flags = els.chkCase.checked ? 'g' : 'gi';
                    const iterFlags = flags.includes('g') ? flags : flags + 'g';
                    const regex = new RegExp(query, iterFlags);
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        if (match.index === regex.lastIndex) regex.lastIndex++;
                        searchMatches.push({ start: match.index, end: match.index + match[0].length });
                    }
                } else {
                    const searchStr = els.chkCase.checked ? query : query.toLowerCase();
                    const targetStr = els.chkCase.checked ? text : text.toLowerCase();
                    let pos = 0;
                    while ((pos = targetStr.indexOf(searchStr, pos)) !== -1) {
                        searchMatches.push({ start: pos, end: pos + searchStr.length });
                        pos += searchStr.length;
                    }
                }

                els.matchCount.textContent = `匹配項: ${searchMatches.length}`;
                if (searchMatches.length > 0) {
                    els.status.textContent = `找到 ${searchMatches.length} 個匹配項`;
                } else {
                    els.status.textContent = `無符合結果`;
                }
            } catch (e) {
                els.matchCount.textContent = `匹配項: 錯誤`;
                els.status.textContent = `語法錯誤: ${e.message}`;
            }
        }

        // --- 精準高亮與定位 ---
        function focusCurrentMatch() {
            if (searchMatches.length === 0) return;
            if (currentMatchIdx < 0 || currentMatchIdx >= searchMatches.length) currentMatchIdx = 0;
            
            const match = searchMatches[currentMatchIdx];
            els.input.focus();
            els.input.setSelectionRange(match.start, match.end);
            
            const ratio = match.start / (els.input.value.length || 1);
            els.input.scrollTop = (ratio * els.input.scrollHeight) - (els.input.clientHeight / 2);
            
            els.status.textContent = `定位: 第 ${currentMatchIdx + 1} / ${searchMatches.length} 個匹配項`;
        }

        // --- 找下一個 ---
        document.getElementById('btnFindNext').addEventListener('click', () => {
            if (searchMatches.length === 0) return;
            const cursor = els.input.selectionStart;
            const exactMatchIdx = searchMatches.findIndex(m => m.start === cursor);
            if (exactMatchIdx !== -1) {
                currentMatchIdx = (exactMatchIdx + 1) % searchMatches.length;
            } else {
                const nextIdx = searchMatches.findIndex(m => m.start > cursor);
                currentMatchIdx = (nextIdx !== -1) ? nextIdx : 0;
            }
            focusCurrentMatch();
        });

        // --- 單一取代 ---
        document.getElementById('btnReplaceSingle').addEventListener('click', () => {
            if (searchMatches.length === 0) return;
            if (currentMatchIdx < 0) currentMatchIdx = 0;
            
            const match = searchMatches[currentMatchIdx];
            const text = els.input.value;
            const query = els.search.value;
            const replaceWith = els.replace.value;
            
            let actualReplaceStr = replaceWith;
            if (els.chkRegEx.checked) {
                const flags = els.chkCase.checked ? '' : 'i';
                const regex = new RegExp(query, flags);
                const matchedText = text.substring(match.start, match.end);
                actualReplaceStr = matchedText.replace(regex, replaceWith);
            }
            
            els.input.value = text.substring(0, match.start) + actualReplaceStr + text.substring(match.end);
            
            const newCursorPos = match.start + actualReplaceStr.length;
            els.input.selectionStart = newCursorPos;
            els.input.selectionEnd = newCursorPos;

            syncToOutput();
            updateSearchStatus();
            
            if (searchMatches.length > 0) {
                let nextIdx = searchMatches.findIndex(m => m.start >= newCursorPos);
                currentMatchIdx = (nextIdx !== -1) ? nextIdx : 0;
                focusCurrentMatch();
            } else {
                els.status.textContent = '已無更多匹配項';
            }
        });

        // --- 全部取代 ---
        document.getElementById('btnReplaceAll').addEventListener('click', () => {
            const text = els.input.value;
            const query = els.search.value;
            const replaceWith = els.replace.value;
            if (!query) return;

            try {
                let resultText = '';
                if (els.chkRegEx.checked) {
                    const flags = els.chkCase.checked ? 'g' : 'gi';
                    const regex = new RegExp(query, flags);
                    resultText = text.replace(regex, replaceWith);
                } else {
                    if (els.chkCase.checked) {
                        resultText = text.split(query).join(replaceWith);
                    } else {
                        const escapedQuery = query.replace(/[.*+?^${}()|[\]\]/g, '\$&');
                        const regex = new RegExp(escapedQuery, 'gi');
                        resultText = text.replace(regex, replaceWith);
                    }
                }
                els.input.value = resultText;
                syncToOutput();
                updateSearchStatus();
                els.status.textContent = '全部取代完成！';
            } catch (e) {
                alert('取代失敗：' + e.message);
            }
        });

        function syncToOutput() {
            els.output.value = els.input.value;
            if (els.chkVis.checked) updateVisualizer(els.output.value);
        }

        // --- 進階快捷處理 ---
        document.getElementById('btnEscapeToReal').addEventListener('click', () => {
            els.input.value = els.input.value.replace(/\n/g, '
').replace(/\t/g, '	').replace(/\r/g, '
').replace(/\\/g, '\');
            syncToOutput(); updateSearchStatus();
            els.status.textContent = '轉換完成：字面跳脫 ➜ 實際字元';
        });

        document.getElementById('btnRealToEscape').addEventListener('click', () => {
            els.input.value = els.input.value.replace(/\/g, '\\').replace(/
/g, '\n').replace(/	/g, '\t').replace(/
/g, '\r');
            syncToOutput(); updateSearchStatus();
            els.status.textContent = '轉換完成：實際字元 ➜ 字面跳脫';
        });

        document.getElementById('btnStripHidden').addEventListener('click', () => {
            const originalLength = els.input.value.length;
            els.input.value = els.input.value.replace(/[​‌‍﻿ ]/g, '');
            syncToOutput(); updateSearchStatus();
            els.status.textContent = `清理完成！共移除 ${originalLength - els.input.value.length} 個隱形字元。`;
        });

        // --- 不可見字元視覺化 ---
        function updateVisualizer(textTarget) {
            if (!els.chkVis.checked) return;
            let html = escapeHtml(textTarget);
            html = html.replace(/ /g, '<span class="vis-space">·</span>')
                       .replace(/	/g, '<span class="vis-tab">→	</span>')
                       .replace(/
/g, '<span class="vis-newline">↵</span>
')
                       .replace(/[​]/g, '<span class="vis-hidden">ZWSP</span>')
                       .replace(/[﻿]/g, '<span class="vis-hidden">BOM</span>')
                       .replace(/[ ]/g, '<span class="vis-hidden">NBSP</span>');
            els.visualizer.innerHTML = html;
        }

        els.chkVis.addEventListener('change', (e) => {
            if (e.target.checked) {
                els.output.classList.add('hidden');
                els.visualizer.classList.remove('hidden');
                els.output.value = els.output.value || els.input.value;
                updateVisualizer(els.output.value);
            } else {
                els.output.classList.remove('hidden');
                els.visualizer.classList.add('hidden');
            }
        });

        // ==========================================
        // 巨集多行指令引擎 (Macro Instruction Engine)
        // ==========================================

        // 解析巨集欄 (巨集欄內專屬轉義 
, 	, \=, \)
        function parseMacroRules() {
            const rawText = els.macroInput.value;
            const lines = rawText.split(/
?
/);
            const rules = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith('#') || line.startsWith('//')) continue;

                // 尋找未經反斜線轉義的 '=' 分隔符號
                let splitIdx = -1;
                for (let j = 0; j < line.length; j++) {
                    if (line[j] === '=' && (j === 0 || line[j - 1] !== '\')) {
                        splitIdx = j;
                        break;
                    }
                }

                if (splitIdx === -1) continue;

                let leftRaw = line.substring(0, splitIdx);
                let rightRaw = line.substring(splitIdx + 1);

                let isReturn = false;
                if (rightRaw.startsWith('(return)')) {
                    isReturn = true;
                    rightRaw = rightRaw.substring(8); // 移除 '(return)'
                }

                // 將巨集欄內的字面 
, 	, \=, \ 解析為實際字元
                const unescapeMacroStr = (str) => {
                    return str
                        .replace(/\n/g, '
')
                        .replace(/\t/g, '	')
                        .replace(/\=/g, '=')
                        .replace(/\\/g, '\');
                };

                const left = unescapeMacroStr(leftRaw);
                const right = unescapeMacroStr(rightRaw);

                rules.push({
                    left,
                    right,
                    original: line,
                    isReturn,
                    lineNo: i + 1
                });
            }
            return rules;
        }

        function resetMacro() {
            macroState.currentText = els.input.value;
            macroState.rules = parseMacroRules();
            macroState.isHalted = false;
            macroState.stepCount = 0;
            macroState.batchRuleIndex = 0;

            els.macroStepCount.textContent = '巨集步數: 0';
            els.logContainer.innerHTML = '';
            appendLog(`<span class="log-success">巨集狀態已重置。規則數: ${macroState.rules.length} 條。</span>`);
            els.status.textContent = '巨集重置完成';
        }

        // 執行單步巨集 (A=B 模式 或 批次順序模式)
        function stepMacro() {
            if (macroState.rules.length === 0) {
                macroState.rules = parseMacroRules();
            }

            if (macroState.rules.length === 0) {
                appendLog(`<span class="log-halted">錯誤：未檢測到有效巨集指令（請在巨集欄輸入「尋找=取代」格式）。</span>`);
                return false;
            }

            if (macroState.isHalted) {
                appendLog(`<span class="log-halted">巨集已終止，請點擊「重置」後重新執行。</span>`);
                return false;
            }

            const isCase = els.chkMacroCase.checked;
            const isRegEx = els.chkMacroRegEx.checked;
            const mode = document.querySelector('input[name="macroMode"]:checked').value;

            if (mode === 'ab') {
                // A=B 邏輯模式：每次從頭掃描第 1 條匹配規則並套用一次
                for (let i = 0; i < macroState.rules.length; i++) {
                    const rule = macroState.rules[i];
                    if (!rule.left) continue;

                    let matchIndex = -1;
                    let matchLength = 0;
                    let replacementStr = rule.right;

                    if (isRegEx) {
                        try {
                            const flags = isCase ? '' : 'i';
                            const regex = new RegExp(rule.left, flags);
                            const match = regex.exec(macroState.currentText);
                            if (match) {
                                matchIndex = match.index;
                                matchLength = match[0].length;
                                replacementStr = match[0].replace(regex, rule.right);
                            }
                        } catch (e) {
                            appendLog(`<span class="log-halted">列 ${rule.lineNo} RegEx 錯誤: ${escapeHtml(e.message)}</span>`);
                            macroState.isHalted = true;
                            return false;
                        }
                    } else {
                        const searchStr = isCase ? rule.left : rule.left.toLowerCase();
                        const targetStr = isCase ? macroState.currentText : macroState.currentText.toLowerCase();
                        matchIndex = targetStr.indexOf(searchStr);
                        matchLength = rule.left.length;
                    }

                    if (matchIndex !== -1) {
                        macroState.currentText = macroState.currentText.substring(0, matchIndex) + 
                                                 replacementStr + 
                                                 macroState.currentText.substring(matchIndex + matchLength);
                        
                        macroState.stepCount++;
                        els.macroStepCount.textContent = `巨集步數: ${macroState.stepCount}`;

                        let logMsg = `[Step ${macroState.stepCount}] <span class="rule-applied">觸發規則 (列 ${rule.lineNo}): ${escapeHtml(rule.original)}</span><br>結果: <span class="log-highlight">${formatForLog(macroState.currentText)}</span>`;

                        if (rule.isReturn) {
                            macroState.isHalted = true;
                            logMsg += `<br><span class="log-halted">觸發 (return) 指令，巨集終止。</span>`;
                        }

                        appendLog(logMsg);
                        syncMacroToOutput();
                        return true;
                    }
                }

                // 若所有規則均未匹配
                macroState.isHalted = true;
                appendLog(`<span class="log-success">巨集執行完畢，無符合規則可套用。</span>`);
                return false;

            } else {
                // 批次順序套用模式：依序對第 batchRuleIndex 條規則進行全字串取代
                if (macroState.batchRuleIndex >= macroState.rules.length) {
                    macroState.isHalted = true;
                    appendLog(`<span class="log-success">批次巨集全部規則執行完畢！</span>`);
                    return false;
                }

                const rule = macroState.rules[macroState.batchRuleIndex];
                let prevText = macroState.currentText;

                try {
                    if (isRegEx) {
                        const flags = isCase ? 'g' : 'gi';
                        const regex = new RegExp(rule.left, flags);
                        macroState.currentText = macroState.currentText.replace(regex, rule.right);
                    } else {
                        if (isCase) {
                            macroState.currentText = macroState.currentText.split(rule.left).join(rule.right);
                        } else {
                            const escapedQuery = rule.left.replace(/[.*+?^${}()|[\]\]/g, '\$&');
                            const regex = new RegExp(escapedQuery, 'gi');
                            macroState.currentText = macroState.currentText.replace(regex, rule.right);
                        }
                    }
                } catch (e) {
                    appendLog(`<span class="log-halted">列 ${rule.lineNo} 批次取代錯誤: ${escapeHtml(e.message)}</span>`);
                    macroState.isHalted = true;
                    return false;
                }

                macroState.stepCount++;
                macroState.batchRuleIndex++;
                els.macroStepCount.textContent = `巨集步數: ${macroState.stepCount}`;

                const changed = (prevText !== macroState.currentText);
                let logMsg = `[Step ${macroState.stepCount}] <span class="rule-applied">批次套用 (列 ${rule.lineNo}): ${escapeHtml(rule.original)}</span> (${changed ? '已變更' : '無符合'})<br>結果: <span class="log-highlight">${formatForLog(macroState.currentText)}</span>`;

                if (rule.isReturn) {
                    macroState.isHalted = true;
                    logMsg += `<br><span class="log-halted">觸發 (return) 指令，批次終止。</span>`;
                }

                appendLog(logMsg);
                syncMacroToOutput();
                return true;
            }
        }

        function runAllMacro() {
            if (macroState.rules.length === 0 || macroState.stepCount === 0) {
                resetMacro();
            }

            if (macroState.isHalted) {
                appendLog(`<span class="log-halted">已處於終止狀態，請點擊「重置」後重新執行。</span>`);
                return;
            }

            let runs = 0;
            while (!macroState.isHalted && macroState.stepCount < macroState.MAX_STEPS) {
                const hasExecuted = stepMacro();
                if (!hasExecuted) break;
                runs++;
            }

            if (macroState.stepCount >= macroState.MAX_STEPS) {
                macroState.isHalted = true;
                appendLog(`<span class="log-halted">警告：達到最大執行步數限制 (${macroState.MAX_STEPS})，防止無限迴圈，已強制停止。</span>`);
            }
        }

        function syncMacroToOutput() {
            els.output.value = macroState.currentText;
            if (els.chkVis.checked) updateVisualizer(els.output.value);
            els.status.textContent = `巨集更新完成 (步數: ${macroState.stepCount})`;
        }

        // --- 綁定巨集按鈕 ---
        document.getElementById('btnRunMacro').addEventListener('click', runAllMacro);
        document.getElementById('btnStepMacro').addEventListener('click', stepMacro);
        document.getElementById('btnResetMacro').addEventListener('click', resetMacro);
        
        document.getElementById('btnClearMacro').addEventListener('click', () => {
            els.macroInput.value = '';
            resetMacro();
        });

        document.getElementById('btnLoadMacroSample').addEventListener('click', () => {
            els.macroInput.value = `# 範例 1: 文字汱換與轉義符號範例 (巨集欄特有 \n 與 \t)
hello=\tHi
apple=banana
\n=, 

# 範例 2: 條件終止 (return) 範例
# stop=(return)END`;

            els.input.value = `hello world
apple pie
banana smoothie
stop processing`;

            updateSearchStatus();
            resetMacro();
            els.status.textContent = '已載入巨集範例與測試文字';
        });

        document.getElementById('btnApplyOutToIn').addEventListener('click', () => {
            if (els.output.value) {
                els.input.value = els.output.value;
                updateSearchStatus();
                resetMacro();
                els.status.textContent = '已將處理結果 (Output) 套用至輸入區 (Input)';
            }
        });

        document.getElementById('btnClearLogs').addEventListener('click', () => {
            els.logContainer.innerHTML = '<div class="text-gray-400 italic text-center py-2">日誌已清空...</div>';
        });

        // --- 佈局與主題切換 ---
        let isRowLayout = true;
        document.getElementById('btnLayout').addEventListener('click', () => {
            isRowLayout = !isRowLayout;
            els.workspace.className = isRowLayout 
                ? "flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden" 
                : "flex-1 flex flex-col p-4 gap-4 overflow-hidden";
        });

        document.getElementById('btnTheme').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // --- 剪貼簿按鈕 ---
        document.getElementById('btnCopyIn').addEventListener('click', () => {
            navigator.clipboard.writeText(els.input.value).then(() => els.status.textContent = '輸入區內容已複製！');
        });

        document.getElementById('btnCopyOut').addEventListener('click', () => {
            const textToCopy = els.output.value || els.input.value;
            navigator.clipboard.writeText(textToCopy).then(() => els.status.textContent = '輸出結果已複製！');
        });

        document.getElementById('btnPaste').addEventListener('click', async () => {
            try {
                els.input.value = await navigator.clipboard.readText();
                updateSearchStatus();
                resetMacro();
            } catch (err) {
                alert('請手動貼上 (Ctrl+V)');
            }
        });

        document.getElementById('btnClearIn').addEventListener('click', () => {
            els.input.value = '';
            updateSearchStatus();
            resetMacro();
        });

        document.getElementById('btnClearOut').addEventListener('click', () => {
            els.output.value = '';
            els.visualizer.innerHTML = '';
        });

        // --- 監聽即時變動 ---
        els.input.addEventListener('input', () => {
            updateSearchStatus();
            macroState.currentText = els.input.value;
        });

        els.search.addEventListener('input', updateSearchStatus);
        els.replace.addEventListener('input', updateSearchStatus);
        els.chkCase.addEventListener('change', updateSearchStatus);
        els.chkRegEx.addEventListener('change', updateSearchStatus);

        // 初始初始化
        updateSearchStatus();
    </script>
</body>
</html>
