<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複息滾存計算機 (Compound Interest Calculator)</title>

    <!-- Tailwind CSS（已修正 CDN 網址） -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts（已修正 @import 網址，改用 link 更穩定） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight sm:text-4xl">複息滾存計算機</h1>
            <p class="mt-2 text-sm text-slate-600">輸入資產或貸款條件，即時計算「利疊利」的長遠財富效應。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-8 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

            <!-- Inputs Panel (40% width on desktop) -->
            <div class="md:col-span-2 p-6 bg-slate-50/50 border-r border-slate-100 space-y-5">
                <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-200 pb-2">參數設定</h2>

                <!-- Initial Principal -->
                <div>
                    <label for="principal" class="block text-sm font-medium text-slate-700 mb-1">起始本金 ($)</label>
                    <input type="number" id="principal" value="10000" min="0" step="100"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Monthly Contribution -->
                <div>
                    <label for="contribution" class="block text-sm font-medium text-slate-700 mb-1">每月額外投入/供款 ($)</label>
                    <input type="number" id="contribution" value="0" min="0" step="100"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Annual Interest Rate -->
                <div>
                    <label for="rate" class="block text-sm font-medium text-slate-700 mb-1">年利率 (%)</label>
                    <input type="number" id="rate" value="20" min="0" step="0.1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Period (Years) -->
                <div>
                    <label for="years" class="block text-sm font-medium text-slate-700 mb-1">滾存年期 (年)</label>
                    <input type="number" id="years" value="10" min="1" max="100" step="1"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Compounding Frequency -->
                <div>
                    <label for="frequency" class="block text-sm font-medium text-slate-700 mb-1">複息頻率</label>
                    <select id="frequency"
                            class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        <option value="12" selected>每月複息 (預設)</option>
                        <option value="4">每季複息</option>
                        <option value="2">每半年複息</option>
                        <option value="1">每年複息</option>
                        <option value="365">每日複息</option>
                    </select>
                </div>
            </div>

            <!-- Results Panel (60% width on desktop) -->
            <div class="md:col-span-3 p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-slate-900 border-b border-slate-200 pb-2 mb-6">計算結果</h2>

                    <!-- Highlight Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                            <span class="block text-xs font-medium text-blue-600 uppercase tracking-wider">最終總金額 (本利和)</span>
                            <span id="resTotal" class="block text-2xl font-bold text-blue-900 mt-1">$0.00</span>
                        </div>
                        <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                            <span class="block text-xs font-medium text-emerald-600 uppercase tracking-wider">淨賺利息總額</span>
                            <span id="resInterest" class="block text-2xl font-bold text-emerald-900 mt-1">$0.00</span>
                        </div>
                    </div>

                    <div class="space-y-2 text-sm text-slate-600 border-t border-slate-100 pt-4">
                        <div class="flex justify-between">
                            <span>總投入本金:</span>
                            <span id="resPrincipal" class="font-semibold text-slate-900">$0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span>名義年利率:</span>
                            <span id="resNominalRate" class="font-semibold text-slate-900">0.00%</span>
                        </div>
                        <div class="flex justify-between">
                            <span>實際年利率 (EAR):</span>
                            <span id="resEffectiveRate" class="font-bold text-amber-600">0.00%</span>
                        </div>
                    </div>
                </div>

                <!-- Quick Breakdown Table View -->
                <div class="mt-6">
                    <h3 class="text-sm font-semibold text-slate-900 mb-2">年度增長摘要</h3>
                    <div class="overflow-x-auto max-h-48 border border-slate-200 rounded-lg shadow-inner">
                        <table class="w-full text-sm text-left text-slate-500">
                            <thead class="text-xs text-slate-700 uppercase bg-slate-50 sticky top-0 border-b border-slate-200">
                                <tr>
                                    <th class="px-4 py-2">年末</th>
                                    <th class="px-4 py-2">累積投入本金</th>
                                    <th class="px-4 py-2">累積利息</th>
                                    <th class="px-4 py-2">總結餘 (本利和)</th>
                                </tr>
                            </thead>
                            <tbody id="breakdownBody">
                                <!-- Dynamic rows via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
    (function () {
        'use strict';

        const $ = (id) => document.getElementById(id);
        const INPUT_IDS = ['principal', 'contribution', 'rate', 'years', 'frequency'];

        /* ---------- 格式化工具 ---------- */
        function formatCurrency(value) {
            return '$' + value.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatPercent(value) {
            return (value * 100).toFixed(2) + '%';
        }

        /* ---------- 安全讀取數字 ---------- */
        function readNumber(id, fallback = 0) {
            const v = parseFloat($(id).value);
            return Number.isFinite(v) ? v : fallback;
        }

        /* ---------- 主計算 ---------- */
        function calculate() {
            // 1. 讀取並夾限輸入值
            const P      = Math.max(0, readNumber('principal', 0));       // 起始本金
            const PMT    = Math.max(0, readNumber('contribution', 0));    // 每月投入
            const r      = Math.max(0, readNumber('rate', 0)) / 100;      // 年利率（小數）
            const years  = Math.min(100, Math.max(1, Math.round(readNumber('years', 1))));
            const n      = parseInt($('frequency').value, 10) || 12;      // 每年複息次數

            // 2. 實際年利率 EAR
            const ear = Math.pow(1 + r / n, n) - 1;

            // 3. 把「每期複息」換算成「等效月利率」
            //    這樣 12 個月後的累積增長剛好等於 (1 + r/n)^n，
            //    即與標準公式 P*(1+r/n)^(n*t) 完全一致，且能精確處理每月供款。
            const monthlyRate = Math.pow(1 + r / n, n / 12) - 1;

            let balance  = P;   // 當前結餘
            let invested = P;   // 累積投入本金
            let rows     = '';

            // 4. 逐年 × 逐月滾存
            for (let year = 1; year <= years; year++) {
                for (let month = 1; month <= 12; month++) {
                    // 每月月初投入
                    balance  += PMT;
                    invested += PMT;
                    // 該月複息增長
                    balance  *= (1 + monthlyRate);
                }

                const interest = balance - invested;

                rows +=
                    '<tr class="bg-white border-b border-slate-100 hover:bg-slate-50/80">' +
                        '<td class="px-4 py-2 font-medium text-slate-900 whitespace-nowrap">第 ' + year + ' 年</td>' +
                        '<td class="px-4 py-2 whitespace-nowrap">' + formatCurrency(invested) + '</td>' +
                        '<td class="px-4 py-2 whitespace-nowrap text-emerald-700">' + formatCurrency(interest) + '</td>' +
                        '<td class="px-4 py-2 whitespace-nowrap font-semibold text-slate-800">' + formatCurrency(balance) + '</td>' +
                    '</tr>';
            }

            // 5. 更新畫面
            $('resTotal').textContent         = formatCurrency(balance);
            $('resInterest').textContent      = formatCurrency(balance - invested);
            $('resPrincipal').textContent     = formatCurrency(invested);
            $('resNominalRate').textContent   = formatPercent(r);
            $('resEffectiveRate').textContent = formatPercent(ear);
            $('breakdownBody').innerHTML      = rows;
        }

        /* ---------- 綁定事件 ---------- */
        INPUT_IDS.forEach(function (id) {
            const el = $(id);
            el.addEventListener('input', calculate);
            el.addEventListener('change', calculate);
        });

        /* ---------- 首次載入即計算 ---------- */
        calculate();
    })();
    </script>
</body>
</html>
